name: Build and deploy TV3

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tv3-deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/liveackerman/moontvplus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install deployment key
        env:
          TV3_SSH_KEY: ${{ secrets.TV3_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$TV3_SSH_KEY" > "$HOME/.ssh/tv3_key"
          chmod 600 "$HOME/.ssh/tv3_key"

      - name: Ensure TV3 compose and restart container
        env:
          TV3_HOST: ${{ secrets.TV3_HOST }}
          TV3_USER: ${{ secrets.TV3_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          export COMPOSE_B64="$(printf '%s\n' \
            'services:' \
            '  moontvplus:' \
            '    image: ghcr.io/liveackerman/moontvplus:latest' \
            '    container_name: moontvplus-tv3' \
            '    restart: unless-stopped' \
            '    env_file:' \
            '      - .env' \
            '    environment:' \
            '      SITE_BASE: https://tv3.ljw44.com' \
            '    ports:' \
            '      - "3013:3000"' \
            '    volumes:' \
            '      - ./data:/app/.data' \
            '      - ./offline-downloads:/data' \
            | base64 -w 0)"
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/tv3_key" -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$TV3_USER@$TV3_HOST" \
            "sudo -n docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i "$HOME/.ssh/tv3_key" -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$TV3_USER@$TV3_HOST" \
            "export COMPOSE_B64='$COMPOSE_B64'; sudo -n mkdir -p /opt/moontvplus-tv3/data /opt/moontvplus-tv3/offline-downloads; printf '%s' \"\$COMPOSE_B64\" | base64 -d | sudo -n tee /opt/moontvplus-tv3/docker-compose.yml >/dev/null; cd /opt/moontvplus-tv3; sudo -n docker compose -f docker-compose.yml pull; sudo -n docker compose -f docker-compose.yml up -d --remove-orphans"
